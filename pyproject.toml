[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "peridem"
version = "0.3.0"
description = "Python interface to PeriDEM: set up, run and inspect granular peridynamics simulations"
readme = "python/README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# snapshot() renders with matplotlib; read_vtu() needs the VTK Python module,
# which normally comes from the same VTK install the C++ library links.
plot = ["matplotlib"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/prashjha/PeriDEM"
Documentation = "https://prashjha.github.io/PeriDEM/"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.args = [
  "-DEnable_Python=ON",
  "-DEnable_Tests=OFF",
  "-DEnable_Examples=OFF",
  "-DEnable_Documentation=OFF",
]
wheel.packages = ["python/peridem"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
